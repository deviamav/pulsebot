name: taskbot

services:
    postgres:
        image: postgres:16-alpine
        container_name: taskbot-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - taskbot-net

    redis:
        image: redis:7-alpine
        container_name: taskbot-redis
        restart: unless-stopped
        command: >
            redis-server
            --appendonly yes
            ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - taskbot-net

    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: taskbot-bot
        restart: unless-stopped
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "127.0.0.1:8080:8080"
        networks:
            - taskbot-net
        command: >
            sh -c "alembic upgrade head && python -m app"

volumes:
    postgres_data:
    redis_data:

networks:
    taskbot-net:
        driver: bridge
